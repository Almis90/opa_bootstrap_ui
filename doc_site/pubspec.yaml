name: doc_site
description: "Documentation site for opa_bootstrap_ui, structured after getbootstrap.com's docs."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  opa_bootstrap_ui:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    # Bootstrap's own screenshots for the Heroes example.
    - assets/examples/heroes/
    - assets/examples/features/
    - assets/brand/
  fonts:
    # Roboto (Apache 2.0): static Light/Regular/Medium/Bold instances of the
    # latin subset of Google Fonts' variable Roboto — the very file Bootstrap's
    # pages get with `--font roboto` (tool/vendor_examples.mjs). The web
    # engine's own fallback Roboto has no real Light/Medium/Bold, so `fw-bold`,
    # headings (500) and `.lead`/display (300) would be synthesised, and its
    # widths differ. There is no SemiBold (the reference pages load 300, 400, 500
    # and 700 only, so `fw-semibold` is rendered Bold there too).
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    # Blog example's own web fonts (SIL Open Font License), from Google Fonts: its
    # headings are Playfair Display (Amiri in the RTL page).
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-Black.ttf
          weight: 900
    # The Arabic pages' body text: Noto Sans Arabic Regular (SIL Open Font
    # License), the arabic subset Google Fonts serves, as a TTF (the web engine
    # can't read WOFF2). Without it the engine fetches the font from
    # fonts.gstatic.com the first time Arabic text is drawn, and shows boxes
    # until it arrives.
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.woff
          weight: 400
        - asset: assets/fonts/Amiri-Bold.woff
          weight: 700
